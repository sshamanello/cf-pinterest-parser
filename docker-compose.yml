services:
  cf-runner: &cf-base
    build: .
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    shm_size: "1gb"
    restart: "no"
    command: ["run", "python", "run.py", "--help"]

  cf-batch-cron:
    <<: *cf-base
    restart: unless-stopped
    profiles: ["cron"]
    environment:
      CF_CRON_SCHEDULE: ${CF_CRON_SCHEDULE:-10 * * * *}
      CF_RUN_COMMAND: ${CF_RUN_COMMAND:-python run.py prod-auto-pin --niche fonts --pages 100 --limit 120 --output output/docker_prod --upload-vds --sync-sheet}
      CF_SKIP_EXISTING_SHEET: ${CF_SKIP_EXISTING_SHEET:-true}
      CF_PAGE_CURSOR_FILE: ${CF_PAGE_CURSOR_FILE:-output/_state/page_cursor.json}
      CF_PAGE_CURSOR_MAX: ${CF_PAGE_CURSOR_MAX:-1000}
      CF_ADAPTIVE_ENABLED: ${CF_ADAPTIVE_ENABLED:-true}
      CF_ADAPTIVE_TARGET_NEW: ${CF_ADAPTIVE_TARGET_NEW:-50}
      CF_ADAPTIVE_MAX_PAGES_PER_RUN: ${CF_ADAPTIVE_MAX_PAGES_PER_RUN:-300}
    command: ["cron"]

  cf-phone-scheduler:
    <<: *cf-base
    restart: unless-stopped
    profiles: ["phone"]
    privileged: true
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - /dev/bus/usb:/dev/bus/usb
    environment:
      CF_LOG_DIR: /app/logs
    command: ["scheduler"]
