services:
  cf-parser:
    build: .
    container_name: cf-parser
    env_file: .env
    volumes:
      - ./output:/app/output                          # пины сохраняются на хосте
      - ./credentials.json:/app/credentials.json:ro  # ключ Google (read-only)
    shm_size: '1gb'    # Chromium требует увеличенного /dev/shm
    restart: "no"      # запускается по cron, не как демон
