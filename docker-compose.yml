services:
  cf-runner: &cf-base
    build: .
    env_file: .env
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    shm_size: "1gb"
    restart: "no"
    command: ["run", "python", "run.py", "--help"]

  cf-batch-cron:
    <<: *cf-base
    restart: unless-stopped
    profiles: ["cron"]
    environment:
      CF_CRON_SCHEDULE: ${CF_CRON_SCHEDULE:-0 2 * * *}
      CF_RUN_COMMAND: ${CF_RUN_COMMAND:-python run.py prod-auto-pin --niche fonts --pages 1 --limit 20 --output output/docker_prod --upload-vds --sync-sheet}
    command: ["cron"]

  cf-phone-scheduler:
    <<: *cf-base
    restart: unless-stopped
    profiles: ["phone"]
    privileged: true
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - /dev/bus/usb:/dev/bus/usb
    environment:
      CF_LOG_DIR: /app/logs
    command: ["scheduler"]
